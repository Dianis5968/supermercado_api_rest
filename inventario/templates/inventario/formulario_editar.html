<!DOCTYPE html>
<html>
<head>
    <title>Editar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>✏️ Editar Producto</h1>
        <hr>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Nombre:</label>
                <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
            </div>
            <div class="mb-3">
                <label>Precio:</label>
                <input type="number" name="precio" class="form-control" value="{{ producto.precio }}" required>
            </div>
            <div class="mb-3">
                <label>Cantidad:</label>
                <input type="number" name="cantidad" class="form-control" value="{{ producto.cantidad }}" required>
            </div>
            <div class="mb-3">
                <label>ID Categoría:</label>
                <input type="number" name="categoria" class="form-control" value="{{ producto.categoria.id }}" required>
            </div>
            <button type="submit" class="btn btn-warning">🔄 Actualizar</button>
            <a href="{% url 'inventario:lista_productos' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
